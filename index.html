<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#181818" />
    <title>Витрина</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
      ;(function () {
        var tg = window.Telegram && window.Telegram.WebApp
        var root = document.documentElement
        var themeVars = [
          '--tg-theme-bg-color',
          '--tg-theme-secondary-bg-color',
          '--tg-theme-text-color',
          '--tg-theme-hint-color',
          '--tg-theme-link-color',
          '--tg-theme-button-color',
          '--tg-theme-button-text-color',
          '--tg-theme-destructive-text-color',
        ]
        if (tg) {
          try {
            tg.ready()
            tg.expand()
            tg.setHeaderColor('secondary_bg_color')
          } catch (e) {}
        }
        var inTelegram = Boolean(tg && tg.platform && tg.platform !== 'unknown')
        if (!inTelegram) {
          var lightPreview = /(?:^|[?&])theme=light(?:&|$)/.test(window.location.search)
          themeVars.forEach(function (name) {
            root.style.removeProperty(name)
          })
          if (lightPreview) {
            var preview = {
              '--tg-theme-bg-color': '#ffffff',
              '--tg-theme-secondary-bg-color': '#f2f2f7',
              '--tg-theme-text-color': '#000000',
              '--tg-theme-hint-color': '#8e8e93',
              '--tg-theme-link-color': '#007aff',
              '--tg-theme-button-color': '#007aff',
              '--tg-theme-button-text-color': '#ffffff',
              '--tg-theme-destructive-text-color': '#ff3b30',
            }
            Object.keys(preview).forEach(function (name) {
              root.style.setProperty(name, preview[name])
            })
            root.dataset.theme = 'light'
            root.style.colorScheme = 'light'
            return
          }
          root.dataset.theme = 'dark'
          root.style.colorScheme = 'dark'
          return
        }
        var scheme = tg.colorScheme === 'light' ? 'light' : 'dark'
        root.dataset.theme = scheme
        root.style.colorScheme = scheme
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
